[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "scopes-tool"
version = "1.0.0"
description = "Vendor-neutral oscilloscope tooling for supported registered oscilloscope models."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pyvisa>=1.14",
  "pyvisa-py>=0.8.1",
  "psutil>=7.0",
  "zeroconf>=0.147",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "Markdown>=3.7",
  "fastapi>=0.100.0",
  "httpx2>=2.0",
  "pyinstaller>=6.0; sys_platform == 'win32'",
  "pytest>=8",
  "ruff>=0.15.20",
  "uvicorn>=0.23.0",
]
webui = [
  "fastapi>=0.100.0",
  "uvicorn>=0.23.0",
]
all = [
  "fastapi>=0.100.0",
  "uvicorn>=0.23.0",
]

[project.scripts]
scopes-tool = "scopes_tool_cli.cli:main"
scopes-tool-webui = "scopes_tool_webui.server:main"
scopes-tool-webui-launcher = "scopes_tool_webui.launcher:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["scopes_tool_*"]

[tool.setuptools.package-data]
scopes_tool_cli = ["help/*.html", "help/*.css"]
scopes_tool_webui = [
  "static/*.html",
  "static/*.css",
  "static/*.js",
  "static/help/*.html",
  "static/help/*.css",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-p", "no:cacheprovider"]
markers = [
  "frontend_node: WebUI JavaScript runtime tests owned by the Code quality & WebUI CI job; Node.js is required",
  "hardware: opt-in tests that require a real oscilloscope",
  "windows_boundary_smoke: PowerShell starts the selected Python CLI and preserves arguments, JSON, and failures",
  "windows_powershell: PowerShell Live, Preflight, and wrapper contracts run in Windows validation CI",
  "validation_shared: shared Windows PowerShell process, privacy, and safety contracts",
  "validation_keysight: Keysight-specific Windows PowerShell validation contracts",
  "validation_tektronix: Tektronix-specific Windows PowerShell validation contracts",
]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
