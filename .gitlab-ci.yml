# GitLab CI equivalent of .github/workflows/tests.yml
# Mirrors GitHub Actions triggers and test coverage:
# - merge request pipelines
# - pushes to the default branch (main in the current repository)
# - quality checks on Python 3.10
# - Linux tests on Python 3.10, 3.11, 3.12, 3.13
# - Windows tests on Python 3.10, 3.12, 3.13

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: never

stages:
  - test

quality:
  stage: test
  image: python:3.10
  variables:
    # Equivalent to actions/checkout with fetch-depth: 0 for the quality job.
    GIT_DEPTH: "0"
  script:
    - python scripts/check_text_hygiene.py
    - |
      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        export EVENT_NAME="pull_request"
        export PR_BASE_SHA="$CI_MERGE_REQUEST_DIFF_BASE_SHA"
        export PR_HEAD_SHA="${CI_MERGE_REQUEST_SOURCE_BRANCH_SHA:-$CI_COMMIT_SHA}"
      else
        export EVENT_NAME="push"
        export PUSH_BEFORE="$CI_COMMIT_BEFORE_SHA"
        export PUSH_SHA="$CI_COMMIT_SHA"
      fi
      python scripts/check_changed_whitespace.py

pytest-linux:
  stage: test
  image: "python:${PYTHON_VERSION}"
  parallel:
    matrix:
      - PYTHON_VERSION:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
  before_script:
    - python -m pip install --upgrade uv
  script:
    - uv sync --python "$PYTHON_VERSION" --all-extras --locked --link-mode=copy
    - ./.venv/bin/python -c "import scopes_tool_core; import scopes_tool_cli; import scopes_tool_webui"
    - ./.venv/bin/scopes-tool --help
    - ./.venv/bin/python -m pytest -q -m "not hardware"

pytest-windows:
  stage: test
  tags:
    # GitLab.com hosted Windows runner. For a self-managed runner, replace this
    # with that runner's Windows tag (for example: windows).
    - saas-windows-medium-amd64
  parallel:
    matrix:
      - PYTHON_VERSION:
          - "3.10"
          - "3.12"
          - "3.13"
  before_script:
    - python -m pip install --upgrade uv
  script:
    # uv automatically obtains the requested Python version when it is not
    # already installed on the Windows runner.
    - uv sync --python $env:PYTHON_VERSION --all-extras --locked --link-mode=copy
    - .\.venv\Scripts\python.exe -c "import scopes_tool_core; import scopes_tool_cli; import scopes_tool_webui"
    - .\.venv\Scripts\scopes-tool.exe --help
    - .\.venv\Scripts\python.exe -m pytest -q -m "not hardware"
