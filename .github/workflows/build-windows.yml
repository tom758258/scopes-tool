name: Build Windows

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: Windows output to build
        type: choice
        required: true
        default: release
        options:
          - bundle
          - desktop
          - release
          - release-acceptance
      create_draft:
        description: Create GitHub Draft Release (release-acceptance PASS only, main only)
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ inputs.build_mode }}
    runs-on: windows-2025
    timeout-minutes: 60
    outputs:
      version: ${{ steps.meta.outputs.version }}
      artifact_name: ${{ steps.meta.outputs.artifact_name }}
      acceptance_passed: ${{ steps.acceptance.outputs.passed }}
      source_commit: ${{ steps.acceptance.outputs.source_commit }}
    steps:
      - uses: actions/checkout@v6
      - name: Validate options
        shell: pwsh
        run: |
          if ('${{ inputs.create_draft }}' -eq 'true' -and '${{ inputs.build_mode }}' -ne 'release-acceptance') {
            throw 'Draft Releases require build_mode=release-acceptance.'
          }
          if ('${{ inputs.create_draft }}' -eq 'true' -and '${{ github.ref }}' -ne 'refs/heads/main') {
            throw 'Draft Releases can only be created from main.'
          }
      - name: Extract build metadata
        id: meta
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          . ./scripts/_validation_helpers.ps1
          $version = Get-PackageVersion -ProjectRoot $PWD.Path
          $shortSha = git rev-parse --short=7 HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Cannot determine build commit' }
          "version=$version" >> $env:GITHUB_OUTPUT
          "artifact_name=scopes-tool-windows-${{ inputs.build_mode }}-$shortSha" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          architecture: x64
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Install locked dependencies
        run: uv sync --python 3.13 --all-extras --locked --link-mode=copy
      - name: Build Windows output
        if: inputs.build_mode != 'release-acceptance'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $script = switch ('${{ inputs.build_mode }}') {
            'bundle' { '.\scripts\build_windows_bundle.ps1' }
            'desktop' { '.\scripts\build_desktop.ps1' }
            'release' { '.\scripts\build_release.ps1' }
            default { throw 'Unsupported build mode' }
          }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $script
          if ($LASTEXITCODE -ne 0) { throw "$script failed ($LASTEXITCODE)" }
      - name: Smoke actual packaged executables (no hardware)
        if: inputs.build_mode != 'release-acceptance'
        shell: pwsh
        run: |
          if ('${{ inputs.build_mode }}' -eq 'release') {
            $version = '${{ steps.meta.outputs.version }}'
            & .\.venv\Scripts\python.exe scripts/ci_packaging_smoke.py --release-dir "release/$version" --expected-version $version --extract-dir .tmp_tests/actions-release-extracted
          } else {
            & .\.venv\Scripts\python.exe scripts/ci_packaging_smoke.py --mode '${{ inputs.build_mode }}'
          }
          if ($LASTEXITCODE -ne 0) { throw "Windows packaging smoke failed ($LASTEXITCODE)" }
      - name: Run and verify formal release acceptance (no hardware)
        id: acceptance
        if: inputs.build_mode == 'release-acceptance'
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $outputRoot = '.tmp_tests/actions-release-acceptance'
          if (Test-Path -LiteralPath $outputRoot) { throw 'Acceptance output must be fresh.' }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./scripts/release-acceptance.ps1 -OutputRoot $outputRoot
          $acceptanceExitCode = $LASTEXITCODE
          if ($acceptanceExitCode -ne 0) { throw "Release acceptance failed ($acceptanceExitCode)" }
          $runs = @(Get-ChildItem -LiteralPath $outputRoot -Directory -Force)
          if ($runs.Count -ne 1 -or $runs[0].Name -notlike 'run-*') { throw 'Expected exactly one acceptance run.' }
          $runDirectory = $runs[0].FullName
          $reportPath = Join-Path $runDirectory 'report.json'
          if (-not (Test-Path -LiteralPath $reportPath -PathType Leaf)) { throw 'Missing acceptance report.' }
          $report = Get-Content -LiteralPath $reportPath -Raw | ConvertFrom-Json
          $version = '${{ steps.meta.outputs.version }}'
          $sourceCommit = '${{ github.sha }}'
          if ($report.ok -isnot [bool] -or $report.ok -ne $true -or
              $report.acceptance_mode -cne 'committed-clean-head' -or
              $report.source_commit -cne $sourceCommit -or
              $report.project_version -cne $version -or
              $report.hardware_touched -isnot [bool] -or $report.hardware_touched -ne $false) {
            throw 'Acceptance report does not match this clean, no-hardware release.'
          }
          $expectedSteps = @(
            'git-source', 'required-tools', 'versions', 'build-release', 'release-layout',
            'wheel-install', 'sdist-install', 'preflight', 'source-unchanged'
          )
          if (@($report.steps).Count -ne $expectedSteps.Count -or
              @(Compare-Object -ReferenceObject $expectedSteps -DifferenceObject @($report.steps.name) -CaseSensitive).Count -ne 0 -or
              @($report.steps | Where-Object { $_.result -cne 'PASS' -or $_.exit_code -ne 0 }).Count -ne 0) {
            throw 'All nine acceptance steps must PASS.'
          }
          $expected = @(
            "scopes-tool-$version-windows-x64.zip",
            "scopes_tool-$version-py3-none-any.whl",
            "scopes_tool-$version.tar.gz",
            'checksums.txt'
          )
          $destination = '.tmp_tests/actions-artifacts'
          New-Item -ItemType Directory -Path $destination | Out-Null
          foreach ($name in $expected) {
            $artifact = Join-Path $runDirectory "release/$version/$name"
            if (-not (Test-Path -LiteralPath $artifact -PathType Leaf) -or (Get-Item -LiteralPath $artifact).Length -eq 0) {
              throw "Missing or empty acceptance artifact: $name"
            }
            Copy-Item -LiteralPath $artifact -Destination $destination
          }
          "source_commit=$sourceCommit" >> $env:GITHUB_OUTPUT
          'passed=true' >> $env:GITHUB_OUTPUT
      - name: Upload acceptance evidence
        if: always() && inputs.build_mode == 'release-acceptance'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact_name }}-evidence
          path: |
            .tmp_tests/actions-release-acceptance/run-*/report.json
            .tmp_tests/actions-release-acceptance/run-*/summary.md
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
      - name: Stage downloadable ZIP
        if: inputs.build_mode == 'bundle' || inputs.build_mode == 'desktop'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $mode = '${{ inputs.build_mode }}'
          $source = if ($mode -eq 'bundle') { 'dist/scopes-tool' } else { 'dist/desktop/win-unpacked' }
          if (-not (Test-Path -LiteralPath $source -PathType Container)) { throw "Missing output: $source" }
          $staging = '.tmp_tests/actions-stage/scopes-tool'
          $zip = ".tmp_tests/actions-artifacts/scopes-tool-$mode-windows-x64.zip"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          New-Item -ItemType Directory -Force -Path (Split-Path $zip -Parent) | Out-Null
          Copy-Item -Path (Join-Path $source '*') -Destination $staging -Recurse -Force
          Compress-Archive -LiteralPath $staging -DestinationPath $zip
          if (-not (Test-Path -LiteralPath $zip -PathType Leaf)) { throw "Missing ZIP: $zip" }
      - name: Stage release artifacts
        if: inputs.build_mode == 'release'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ steps.meta.outputs.version }}'
          $expected = @(
            "scopes-tool-$version-windows-x64.zip",
            "scopes_tool-$version-py3-none-any.whl",
            "scopes_tool-$version.tar.gz",
            'checksums.txt'
          )
          $destination = '.tmp_tests/actions-artifacts'
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          foreach ($name in $expected) {
            Copy-Item -LiteralPath "release/$version/$name" -Destination $destination
          }
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: .tmp_tests/actions-artifacts/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  draft-release:
    name: Create Draft Release
    needs: build
    if: ${{ inputs.build_mode == 'release-acceptance' && inputs.create_draft && github.ref == 'refs/heads/main' && needs.build.result == 'success' && needs.build.outputs.acceptance_passed == 'true' && needs.build.outputs.source_commit == github.sha }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout same commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Download verified build artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: release-assets
      - name: Check release tag is unused
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name' > existing-releases.txt
          if grep -Fxq "$tag" existing-releases.txt; then
            echo "::error::Release $tag already exists; refusing to overwrite."
            exit 1
          fi
          tags=$(git ls-remote --tags origin "refs/tags/$tag")
          if [[ -n "$tags" ]]; then
            echo "::error::Tag $tag already exists; refusing to reuse it."
            exit 1
          fi
      - name: Create Draft Release (never publish automatically)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "v${VERSION}" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "v${VERSION}" \
            --draft \
            --notes "Windows x64 bundle and Python distribution artifacts. Check checksums.txt before publishing."
