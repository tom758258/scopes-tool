name: Stateful simulator preflight

on:
  push:
    branches:
      - fix/webui-stateful-simulator-math-readback

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest

    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Install packages
        run: uv sync --python 3.13 --all-extras --locked --link-mode=copy

      - name: Check text and whitespace
        run: |
          python scripts/check_text_hygiene.py
          git diff --check HEAD^ HEAD

      - name: Compile Python
        run: ./.venv/bin/python -m compileall -q src tests

      - name: Check changed JavaScript syntax
        run: |
          node --check src/scopes_tool_webui/static/results.js
          node --check src/scopes_tool_webui/static/locale_en.js
          node --check src/scopes_tool_webui/static/locale_zh_tw.js

      - name: Prepare pytest temp root
        run: mkdir -p .tmp_tests

      - name: Run focused regression tests
        run: >-
          ./.venv/bin/python -m pytest -q
          tests/core/test_simulator_session_state.py
          tests/webui/test_simulator_persistence.py
          --basetemp .tmp_tests/preflight-focused

      - name: Run full hardware-free suite
        run: >-
          ./.venv/bin/python -m pytest -q -m "not hardware"
          --basetemp .tmp_tests/preflight-full
