name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality-webui:
    name: Code quality & WebUI
    runs-on: ubuntu-latest

    steps:
      - name: Check out PR head or push commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Install packages
        run: uv sync --python 3.13 --all-extras --locked --link-mode=copy

      - name: Check tracked text hygiene
        run: python scripts/check_text_hygiene.py

      - name: Check committed range whitespace
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: python scripts/check_changed_whitespace.py

      - name: Run Ruff
        run: ./.venv/bin/python -m ruff check src tests

      - name: Check WebUI JavaScript syntax
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files 'src/scopes_tool_webui/static/*.js')
          if (( ${#files[@]} == 0 )); then
            echo "::error::No tracked WebUI JavaScript files found."
            exit 1
          fi
          for file in "${files[@]}"; do
            node --check "$file"
          done

      - name: Run WebUI Node runtime tests
        run: >-
          ./.venv/bin/python -m pytest -q -rs
          --basetemp .tmp_tests/ci-quality-webui
          -m frontend_node tests/webui

  pytest-linux:
    name: Linux Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Install packages
        run: uv sync --python ${{ matrix.python-version }} --all-extras --locked --link-mode=copy

      - name: Build Python package
        run: ./.venv/bin/python -m build

      - name: Smoke installed package
        run: |
          ./.venv/bin/python -c "import scopes_tool_core; import scopes_tool_cli; import scopes_tool_webui"
          ./.venv/bin/scopes-tool --help

      - name: Prepare pytest temp root
        run: python -c "from pathlib import Path; Path('.tmp_tests').mkdir(parents=True, exist_ok=True)"

      - name: Run primary Python tests
        if: matrix.python-version == '3.13'
        run: >-
          ./.venv/bin/python -m pytest -q
          -m "not hardware and not windows_powershell and not frontend_node"
          --basetemp .tmp_tests/ci-linux-py${{ matrix.python-version }}

      - name: Run Python compatibility contracts
        if: matrix.python-version != '3.13'
        run: >-
          ./.venv/bin/python -m pytest -q
          -m "not hardware and not windows_powershell and not frontend_node"
          --basetemp .tmp_tests/ci-linux-py${{ matrix.python-version }}
          tests/core/test_identity.py tests/core/test_capabilities.py
          tests/core/test_drivers.py tests/core/test_run_config.py tests/core/test_operations.py
          tests/cli/test_agent_safe_cli_basics.py tests/cli/test_driver_selection_cli.py
          tests/cli/test_sequence_cli.py tests/webui/test_webui_api.py
          tests/test_supported_operation_surface_consistency.py::test_declared_operations_have_acceptance_cases_and_adapter_routes
          tests/test_supported_operation_surface_consistency.py::test_legacy_tektronix_storage_is_rejected_by_public_adapters
          tests/cli/test_worker_cli.py::test_worker_http_rejects_non_v2_requests_before_side_effects
          tests/cli/test_worker_cli.py::test_worker_stop_cancels_multiple_queued_jobs_safely
          tests/cli/test_worker_cli.py::test_worker_correlation_flows_through_events_and_memory
          tests/cli/test_worker_cli.py::test_worker_lifecycle_failure_before_ready_keeps_stderr_diagnostics
          tests/cli/test_worker_cli.py::test_worker_lifecycle_drains_stderr_without_mixing_stdout_jsonl
          tests/cli/test_worker_cli.py::test_worker_lifecycle_validates_final_summary
          tests/cli/test_worker_cli.py::test_real_simulation_worker_retains_settings_isolates_and_restarts
          tests/cli/test_worker_cli.py::test_direct_json_envelope_has_schema_and_timestamp

  pytest-windows:
    name: Windows Python ${{ matrix.python-version }}
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.12"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Install packages
        run: uv sync --python ${{ matrix.python-version }} --all-extras --locked --link-mode=copy

      - name: Build Python package
        run: .\.venv\Scripts\python.exe -m build

      - name: Smoke installed package
        run: |
          .\.venv\Scripts\python.exe -c "import scopes_tool_core; import scopes_tool_cli; import scopes_tool_webui"
          .\.venv\Scripts\scopes-tool.exe --help

      - name: Prepare pytest temp root
        run: python -c "from pathlib import Path; Path('.tmp_tests').mkdir(parents=True, exist_ok=True)"

      - name: Run Windows Python contracts
        run: >-
          .\.venv\Scripts\python.exe -m pytest -q
          -m "not hardware and not windows_powershell and not frontend_node"
          --basetemp .tmp_tests/ci-windows-py${{ matrix.python-version }}
          tests/cli/test_agent_safe_cli_basics.py tests/cli/test_driver_selection_cli.py
          tests/core/test_output_files.py tests/packaging/test_windows_bundle.py
          tests/webui/test_desktop_host.py tests/webui/test_launcher.py
          tests/webui/test_job_manager_shutdown.py
          tests/cli/test_worker_cli.py::test_worker_http_rejects_non_v2_requests_before_side_effects
          tests/cli/test_worker_cli.py::test_worker_stop_cancels_multiple_queued_jobs_safely
          tests/cli/test_worker_cli.py::test_worker_correlation_flows_through_events_and_memory
          tests/cli/test_worker_cli.py::test_worker_lifecycle_failure_before_ready_keeps_stderr_diagnostics
          tests/cli/test_worker_cli.py::test_worker_lifecycle_drains_stderr_without_mixing_stdout_jsonl
          tests/cli/test_worker_cli.py::test_worker_lifecycle_validates_final_summary
          tests/cli/test_worker_cli.py::test_real_simulation_worker_retains_settings_isolates_and_restarts
          tests/cli/test_worker_cli.py::test_direct_json_envelope_has_schema_and_timestamp

      - name: Run PowerShell Python boundary smoke
        if: matrix.python-version != '3.13'
        run: >-
          .\.venv\Scripts\python.exe -m pytest -q -m "not hardware and windows_boundary_smoke"
          --basetemp .tmp_tests/ci-windows-boundary-py${{ matrix.python-version }}

  pytest-windows-validation:
    name: Windows validation scripts Python 3.13
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Install packages
        run: uv sync --python 3.13 --all-extras --locked --link-mode=copy

      - name: Prepare pytest temp root
        run: python -c "from pathlib import Path; Path('.tmp_tests').mkdir(parents=True, exist_ok=True)"

      - name: Run Windows validation tests
        run: >-
          .\.venv\Scripts\python.exe -m pytest -q -m "not hardware and windows_powershell"
          --basetemp .tmp_tests/ci-windows-validation-py3.13
