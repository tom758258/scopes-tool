name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  detect-windows-validation-changes:
    name: Detect Windows validation and packaging changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      validation_shared: ${{ steps.filter.outputs.validation_shared }}
      validation_keysight: ${{ steps.filter.outputs.validation_keysight }}
      validation_tektronix: ${{ steps.filter.outputs.validation_tektronix }}
      validation_cross_vendor: ${{ steps.filter.outputs.validation_cross_vendor }}
      packaging: ${{ steps.filter.outputs.packaging }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Detect Windows validation and packaging inputs
        id: filter
        uses: dorny/paths-filter@v4
        with:
          base: ${{ github.event.repository.default_branch }}
          predicate-quantifier: some-with-excludes
          filters: |
            validation_shared:
              - 'tests/tooling/test_live_script_invocation.py'
              - 'tests/tooling/test_live_script_validators.py'
              - 'tests/tooling/test_windows_python_boundary.py'
              - 'scripts/live-dvm-check.ps1'
              - 'scripts/live-segmented-check.ps1'
              - 'scripts/live-serial-check.ps1'
              - 'scripts/preflight-cli.ps1'
              - 'scripts/_live_tektronix_helpers.ps1'
            validation_keysight:
              - 'scripts/live-dvm-check.ps1'
              - 'scripts/live-segmented-check.ps1'
              - 'scripts/live-serial-check.ps1'
              - 'scripts/preflight-cli.ps1'
              - 'tests/tooling/test_live_script_controls.py'
              - 'tests/tooling/test_live_script_artifacts.py'
              - 'tests/tooling/test_live_script_dvm_segmented.py'
              - 'tests/tooling/test_live_script_serial.py'
              - 'tests/tooling/test_live_measurement_validation.py'
              - 'tests/tooling/test_preflight_cli_script.py'
            validation_tektronix:
              - 'scripts/_live_tektronix_helpers.ps1'
              - 'tests/tooling/_tektronix_live_test_support.py'
              - 'tests/tooling/tektronix_function_harness.ps1'
              - 'tests/tooling/tektronix_workflow_harness.ps1'
              - 'tests/tooling/test_live_tektronix_script.py'
              - 'tests/tooling/test_live_workflow_script.py'
              - 'src/scopes_tool_core/tektronix.py'
              - 'src/scopes_tool_core/tektronix_simulator.py'
            validation_cross_vendor:
              - 'tests/conftest.py'
              - 'tests/tooling/_validation_grouping.py'
              - 'tests/tooling/_live_script_test_support.py'
              - 'tests/tooling/autoscale_function_harness.ps1'
              - 'tests/tooling/test_live_autoscale_script.py'
              - 'tests/tooling/test_live_trigger_validation.py'
              - 'scripts/ci_validation_partition.py'
              - 'scripts/_validation_helpers.ps1'
              - 'scripts/_artifact_privacy.ps1'
              - 'scripts/live-cli-check.ps1'
              - 'scripts/live-autoscale-check.ps1'
              - 'scripts/live-workflow-check.ps1'
              - 'src/scopes_tool_cli/**'
              - 'src/scopes_tool_core/**'
              - '!src/scopes_tool_core/tektronix.py'
              - '!src/scopes_tool_core/tektronix_simulator.py'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/tests.yml'
            packaging:
              - 'src/**'
              - 'desktop/**'
              - 'scripts/build*.ps1'
              - 'scripts/scopes-tool-windows.spec'
              - 'scripts/windows_*_entry.py'
              - 'scripts/ci_packaging_smoke.py'
              - 'tests/packaging/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/tests.yml'
              - '.github/workflows/build-windows.yml'
  quality-webui:
    name: Code quality & WebUI
    runs-on: ubuntu-latest

    steps:
      - name: Check out PR head or push commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Install packages
        run: uv sync --python 3.13 --all-extras --locked --link-mode=copy

      - name: Check Windows validation partition (collect only)
        run: ./.venv/bin/python scripts/ci_validation_partition.py

      - name: Check tracked text hygiene
        run: python scripts/check_text_hygiene.py

      - name: Check committed range whitespace
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: python scripts/check_changed_whitespace.py

      - name: Run Ruff
        run: ./.venv/bin/python -m ruff check src tests

      - name: Check WebUI JavaScript syntax
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files 'src/scopes_tool_webui/static/*.js')
          if (( ${#files[@]} == 0 )); then
            echo "::error::No tracked WebUI JavaScript files found."
            exit 1
          fi
          for file in "${files[@]}"; do
            node --check "$file"
          done

      - name: Prepare pytest temp root
        run: python -c "from pathlib import Path; Path('.tmp_tests').mkdir(parents=True, exist_ok=True)"

      - name: Run WebUI Node runtime tests
        run: >-
          ./.venv/bin/python -m pytest -q -rs
          --basetemp .tmp_tests/ci-quality-webui
          -m frontend_node tests/webui

      - name: Run Desktop Node runtime tests
        run: node --test tests/webui/desktop-main.test.cjs

  pytest-linux:
    name: Linux Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Install packages
        run: uv sync --python ${{ matrix.python-version }} --all-extras --locked --link-mode=copy

      - name: Build Python package
        run: ./.venv/bin/python -m build

      - name: Smoke installed package
        run: |
          ./.venv/bin/python -c "import scopes_tool_core; import scopes_tool_cli; import scopes_tool_webui"
          ./.venv/bin/scopes-tool --help

      - name: Prepare pytest temp root
        run: python -c "from pathlib import Path; Path('.tmp_tests').mkdir(parents=True, exist_ok=True)"

      - name: Run primary Python tests
        if: matrix.python-version == '3.13'
        run: >-
          ./.venv/bin/python -m pytest -q
          -m "not hardware and not windows_powershell and not frontend_node"
          --basetemp .tmp_tests/ci-linux-py${{ matrix.python-version }}

      - name: Run Python compatibility contracts
        if: matrix.python-version != '3.13'
        run: >-
          ./.venv/bin/python -m pytest -q
          -m "not hardware and not windows_powershell and not frontend_node"
          --basetemp .tmp_tests/ci-linux-py${{ matrix.python-version }}
          tests/core/test_identity.py tests/core/test_capabilities.py
          tests/core/test_drivers.py tests/core/test_run_config.py tests/core/test_operations.py
          tests/cli/test_agent_safe_cli_basics.py tests/cli/test_driver_selection_cli.py
          tests/cli/test_sequence_cli.py tests/webui/test_webui_api.py
          tests/test_supported_operation_surface_consistency.py::test_declared_operations_have_acceptance_cases_and_adapter_routes
          tests/test_supported_operation_surface_consistency.py::test_legacy_tektronix_storage_is_rejected_by_public_adapters
          tests/cli/test_worker_cli.py::test_worker_http_rejects_non_v2_requests_before_side_effects
          tests/cli/test_worker_cli.py::test_worker_stop_cancels_multiple_queued_jobs_safely
          tests/cli/test_worker_cli.py::test_worker_correlation_flows_through_events_and_memory
          tests/cli/test_worker_cli.py::test_worker_lifecycle_failure_before_ready_keeps_stderr_diagnostics
          tests/cli/test_worker_cli.py::test_worker_lifecycle_drains_stderr_without_mixing_stdout_jsonl
          tests/cli/test_worker_cli.py::test_worker_lifecycle_validates_final_summary
          tests/cli/test_worker_cli.py::test_real_simulation_worker_retains_settings_isolates_and_restarts
          tests/cli/test_worker_cli.py::test_direct_json_envelope_has_schema_and_timestamp

  pytest-windows:
    name: Windows Python ${{ matrix.python-version }}
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.12"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Install packages
        run: uv sync --python ${{ matrix.python-version }} --all-extras --locked --link-mode=copy

      - name: Build Python package
        run: .\.venv\Scripts\python.exe -m build

      - name: Smoke installed package
        run: |
          .\.venv\Scripts\python.exe -c "import scopes_tool_core; import scopes_tool_cli; import scopes_tool_webui"
          .\.venv\Scripts\scopes-tool.exe --help

      - name: Prepare pytest temp root
        run: python -c "from pathlib import Path; Path('.tmp_tests').mkdir(parents=True, exist_ok=True)"

      - name: Run Windows Python contracts
        run: >-
          .\.venv\Scripts\python.exe -m pytest -q
          -m "not hardware and not windows_powershell and not frontend_node"
          --basetemp .tmp_tests/ci-windows-py${{ matrix.python-version }}
          tests/cli/test_agent_safe_cli_basics.py tests/cli/test_driver_selection_cli.py
          tests/core/test_output_files.py tests/packaging/test_windows_bundle.py
          tests/webui/test_desktop_host.py tests/webui/test_launcher.py
          tests/webui/test_job_manager_shutdown.py
          tests/cli/test_worker_cli.py::test_worker_http_rejects_non_v2_requests_before_side_effects
          tests/cli/test_worker_cli.py::test_worker_stop_cancels_multiple_queued_jobs_safely
          tests/cli/test_worker_cli.py::test_worker_correlation_flows_through_events_and_memory
          tests/cli/test_worker_cli.py::test_worker_lifecycle_failure_before_ready_keeps_stderr_diagnostics
          tests/cli/test_worker_cli.py::test_worker_lifecycle_drains_stderr_without_mixing_stdout_jsonl
          tests/cli/test_worker_cli.py::test_worker_lifecycle_validates_final_summary
          tests/cli/test_worker_cli.py::test_real_simulation_worker_retains_settings_isolates_and_restarts
          tests/cli/test_worker_cli.py::test_direct_json_envelope_has_schema_and_timestamp

      - name: Run PowerShell Python boundary smoke
        if: matrix.python-version != '3.13'
        run: >-
          .\.venv\Scripts\python.exe -m pytest -q -m "not hardware and windows_boundary_smoke"
          --basetemp .tmp_tests/ci-windows-boundary-py${{ matrix.python-version }}

  windows-validation-shared:
    name: Windows validation shared Python 3.13
    needs: detect-windows-validation-changes
    if: >-
      needs.detect-windows-validation-changes.outputs.validation_shared == 'true' ||
      needs.detect-windows-validation-changes.outputs.validation_cross_vendor == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Install packages
        run: uv sync --python 3.13 --all-extras --locked --link-mode=copy
      - name: Prepare pytest temp root
        run: python -c "from pathlib import Path; Path('.tmp_tests').mkdir(parents=True, exist_ok=True)"
      - name: Run shared Windows validation tests (duration profile)
        run: >-
          .\.venv\Scripts\python.exe -m pytest -q -m "not hardware and windows_powershell and validation_shared"
          --durations=30 --basetemp .tmp_tests/ci-windows-validation-shared-py3.13

  windows-validation-keysight:
    name: Windows validation keysight Python 3.13
    needs: detect-windows-validation-changes
    if: >-
      needs.detect-windows-validation-changes.outputs.validation_keysight == 'true' ||
      needs.detect-windows-validation-changes.outputs.validation_cross_vendor == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Install packages
        run: uv sync --python 3.13 --all-extras --locked --link-mode=copy
      - name: Prepare pytest temp root
        run: python -c "from pathlib import Path; Path('.tmp_tests').mkdir(parents=True, exist_ok=True)"
      - name: Run keysight Windows validation tests (duration profile)
        run: >-
          .\.venv\Scripts\python.exe -m pytest -q -m "not hardware and windows_powershell and validation_keysight"
          --durations=30 --basetemp .tmp_tests/ci-windows-validation-keysight-py3.13

  windows-validation-tektronix:
    name: Windows validation tektronix Python 3.13
    needs: detect-windows-validation-changes
    if: >-
      needs.detect-windows-validation-changes.outputs.validation_tektronix == 'true' ||
      needs.detect-windows-validation-changes.outputs.validation_cross_vendor == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Install packages
        run: uv sync --python 3.13 --all-extras --locked --link-mode=copy
      - name: Prepare pytest temp root
        run: python -c "from pathlib import Path; Path('.tmp_tests').mkdir(parents=True, exist_ok=True)"
      - name: Run tektronix Windows validation tests (two isolated concurrent shards)
        run: .\.venv\Scripts\python.exe scripts/ci_tektronix_validation.py

  windows-validation-gate:
    name: Windows validation scripts Python 3.13
    needs:
      - detect-windows-validation-changes
      - windows-validation-shared
      - windows-validation-keysight
      - windows-validation-tektronix
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all selected Windows validation groups succeeded
        env:
          DETECT_RESULT: ${{ needs.detect-windows-validation-changes.result }}
          SHARED_SELECTED: ${{ needs.detect-windows-validation-changes.outputs.validation_shared == 'true' || needs.detect-windows-validation-changes.outputs.validation_cross_vendor == 'true' }}
          KEYSIGHT_SELECTED: ${{ needs.detect-windows-validation-changes.outputs.validation_keysight == 'true' || needs.detect-windows-validation-changes.outputs.validation_cross_vendor == 'true' }}
          TEKTRONIX_SELECTED: ${{ needs.detect-windows-validation-changes.outputs.validation_tektronix == 'true' || needs.detect-windows-validation-changes.outputs.validation_cross_vendor == 'true' }}
          SHARED_RESULT: ${{ needs.windows-validation-shared.result }}
          KEYSIGHT_RESULT: ${{ needs.windows-validation-keysight.result }}
          TEKTRONIX_RESULT: ${{ needs.windows-validation-tektronix.result }}
        run: |
          python - <<'PY'
          import os
          if os.environ['DETECT_RESULT'] != 'success':
              raise SystemExit('Windows change detection did not succeed')
          for group in ('SHARED', 'KEYSIGHT', 'TEKTRONIX'):
              selected = os.environ[f'{group}_SELECTED'].lower() == 'true'
              actual = os.environ[f'{group}_RESULT']
              expected = 'success' if selected else 'skipped'
              if actual != expected:
                  raise SystemExit(f'{group}: expected {expected}, got {actual}')
              print(f'{group}: {actual} (selected={selected})')
          PY
  windows-packaging-smoke:
    name: Windows real packaging smoke
    needs: detect-windows-validation-changes
    if: needs.detect-windows-validation-changes.outputs.packaging == 'true'
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          architecture: x64
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Install locked dependencies
        run: uv sync --python 3.13 --all-extras --locked --link-mode=copy
      - name: Build Desktop onedir (includes shared Python bundle)
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\build_desktop.ps1
      - name: Smoke packaged executable outputs (no hardware)
        run: .\.venv\Scripts\python.exe scripts/ci_packaging_smoke.py --mode desktop
